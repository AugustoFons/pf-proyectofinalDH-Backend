spring.application.name=marketplease-backend
spring.datasource.url=jdbc:mysql://localhost:3306/marketplease?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=mp
spring.datasource.password=mp

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.jpa.show-sql=true
server.port=8080

jwt.secret=supersecretkeysupersecretkeysupersecretkey
jwt.expiration-ms=86400000

# ── Envío de correos (Gmail SMTP) ─────────────────────────────────────────────
# Hay que generar una "Contraseña de aplicacion" (16 caracteres):
#   1) Activar la verificacion en 2 pasos en la cuenta de Google.
#   2) https://myaccount.google.com/apppasswords  -> generar una para "Correo".
#   3) Pegar ese valor de 16 caracteres en MAIL_PASSWORD (NO tu password real).
# Se leen de variables de entorno; si no estan, usan el valor por defecto de abajo.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:tucorreo@gmail.com}
spring.mail.password=${MAIL_PASSWORD:xxxxxxxxxxxxxxxx}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Remitente que ve el usuario.
app.mail.from=MarketPlease <${MAIL_USERNAME:tucorreo@gmail.com}>
app.mail.enabled=${MAIL_ENABLED:true}
